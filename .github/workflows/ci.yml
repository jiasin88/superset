name: CI

on:
  push:
    branches:
      - 'devin/**'
  pull_request:
    branches:
      - master
      - main

jobs:
  lint-and-security:
    name: Lint & Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install check tools
        run: |
          pip install --upgrade pip
          pip install flake8 safety pip-audit

      - name: Validate requirements files are parseable
        run: |
          pip install --dry-run -r requirements/base.txt 2>&1 | tail -5 || true

      - name: Run flake8 (line-length + basic errors)
        run: |
          flake8 superset/ --max-line-length=120 --select=E501,E302,E303,E711,E712,W291 --count --statistics
        continue-on-error: true

      - name: Run safety CVE scan on base requirements
        run: |
          safety scan -r requirements/base.txt --output text || true

      - name: Run pip-audit on base requirements
        run: |
          pip-audit -r requirements/base.txt --skip-editable 2>&1 | tail -30 || true

  syntax-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax (compileall)
        run: |
          python -m compileall superset/ -q 2>&1 | head -50 || true
