name: Devin PR Validator

on:
  pull_request:
    types: [opened]
    branches:
      - master
      - main

jobs:
  notify-orchestrator:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'devin/')
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Notify orchestrator of PR opened
        env:
          EVENT_JSON: ${{ toJson(github.event) }}
          ORCHESTRATOR_URL: ${{ secrets.ORCHESTRATOR_URL }}
        run: |
          python3 - <<'PYEOF'
          import os, subprocess, sys

          payload = os.environ["EVENT_JSON"]
          url     = os.environ["ORCHESTRATOR_URL"]

          result = subprocess.run([
              "curl", "-s", "-w", "\nHTTP_STATUS:%{http_code}",
              "-X", "POST", f"{url}/webhook/github",
              "-H", "Content-Type: application/json",
              "-H", "X-GitHub-Event: pull_request",
              "--data", payload,
              "--max-time", "30",
          ], capture_output=True, text=True)

          print(result.stdout[-300:])
          if result.returncode != 0:
              print(result.stderr, file=sys.stderr)
              sys.exit(1)

          for line in result.stdout.splitlines():
              if line.startswith("HTTP_STATUS:"):
                  status = int(line.split(":")[1])
                  if status >= 400:
                      print(f"Orchestrator returned HTTP {status}", file=sys.stderr)
                      sys.exit(1)
          PYEOF

      - name: Post PR checklist comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## Devin Auto-Remediation PR

            This PR was automatically created by Devin AI as part of the auto-remediation system.

            ### Review Checklist
            - [ ] Review all changed files
            - [ ] Verify tests pass in CI
            - [ ] Confirm the fix addresses the issue described
            - [ ] Check for any unintended side effects

            > **Note**: CI must pass before merging. A human reviewer must approve this PR.`
            })
