name: Devin CI Healer

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  notify-orchestrator:
    runs-on: ubuntu-latest
    if: |
      startsWith(github.event.workflow_run.head_branch, 'devin/') &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')

    steps:
      - name: Send CI result to orchestrator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORCHESTRATOR_URL: ${{ secrets.ORCHESTRATOR_URL }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_JSON: ${{ toJson(github.event.workflow_run) }}
          REPOSITORY_JSON: ${{ toJson(github.event.repository) }}
        run: |
          export LOGS=$(gh run view "$RUN_ID" --log-failed 2>&1 | head -200 || echo "")

          python3 - <<'PYEOF'
          import json, os, subprocess, sys

          payload = json.dumps({
              "action": "completed",
              "workflow_run": json.loads(os.environ["WORKFLOW_RUN_JSON"]),
              "repository":   json.loads(os.environ["REPOSITORY_JSON"]),
              "logs":         os.environ.get("LOGS", ""),
          })

          url = os.environ["ORCHESTRATOR_URL"]

          result = subprocess.run([
              "curl", "-s", "-w", "\nHTTP_STATUS:%{http_code}",
              "-X", "POST", f"{url}/webhook/github",
              "-H", "Content-Type: application/json",
              "-H", "X-GitHub-Event: workflow_run",
              "--data", payload,
              "--max-time", "30",
          ], capture_output=True, text=True)

          print(result.stdout[-300:])
          if result.returncode != 0:
              print(result.stderr, file=sys.stderr)
              sys.exit(1)
          PYEOF
